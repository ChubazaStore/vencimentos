<h1>Teste de atalhos (rodada 3)</h1>
<p>Toque em cada botão. Se o app do banco abrir, volte para esta página: o botão fica verde. Se o iPhone mostrar "endereço inválido", é só fechar o aviso. No fim, toque em Copiar resultado e cole no chat.</p>
<div id="l"></div><div class="bar"><button id="c">Copiar resultado</button></div>
<script>
var L={'next':['next://','nextapp://','banconext://','next-app://','nextbradesco://'],'Sicoob':['sicoob://','sicoobmoov://','sicoobapp://','moov://','sicoobpf://','sicoobmobile://'],'Agibank':['agibank://','agi://','agiapp://','agibankapp://','bancoagibank://'],'Bmg':['bmg://','bmgbank://','bancobmg://','bmgmobile://','bmgapp://'],'BV':['bv://','bancobv://','bvapp://','bvmobile://','bvbanco://'],'BRB':['brb://','bancobrb://','brbapp://','brbmobile://','brbbank://'],'PayPal':['paypal://','paypalapp://','paypalbr://'],'Sicredi':['sicredi://','sicrediapp://','sicredimobile://','sicredipf://','sicrediapp-pf://'],'Safra':['safra://','safraapp://','bancosafra://','safrapessoal://','safrapf://'],'Daycoval':['daycoval://','bancodaycoval://','daycovalapp://','daycovalpf://','daycovalmobile://'],'Nomad':['nomad://','nomadapp://','getnomad://','nomadbank://','nomadglobal://'],'Novo CAIXA':['caixa://','novocaixa://','caixanovo://','soucaixa://','caixatem://','caixaapp://'],'Banco PAN':['bancopan://','pan://','panapp://','pandigital://','bancopanapp://'],'InfinitePay':['infinitepay://','infinitepayapp://','infinite://','cloudwalk://','infinitepay-app://'],'Nubank':['nubank://','nuapp://','nu://','nubr://','nubank-app://','nubank://home'],'C6 Bank':['c6bank://','c6://','c6app://','c6bank-app://','c6pay://','c6bankapp://'],'Mercado Pago':['mercadopago://','mercadopago://home','mp://','meli://','mercadopagoapp://','mpago://'],'Telegram (controle)':['tg://']};
var R={},cur=null,t0=0,box=document.getElementById('l');
Object.keys(L).forEach(function(n){var d=document.createElement('div');d.className='b';d.innerHTML='<h2>'+n+'</h2><div class="s"></div>';var s=d.lastChild;L[n].forEach(function(u){var b=document.createElement('button');b.className='t';b.textContent=u;b.onclick=function(){cur=b;b._k=n+' '+u;t0=Date.now();var go=Date.now();location.href=u;setTimeout(function(){if(cur===b&&!b._ok)b.classList.add('no')},1800)};s.appendChild(b)});box.appendChild(d)});
function hit(){if(cur&&Date.now()-t0<20000&&!cur._ok){cur._ok=1;cur.classList.remove('no');cur.classList.add('ok');R[cur._k]=1}}
document.addEventListener('visibilitychange',function(){if(document.hidden)hit()});window.addEventListener('pagehide',hit);window.addEventListener('blur',function(){setTimeout(function(){if(document.hidden)hit()},50)});

</script></body></html>
